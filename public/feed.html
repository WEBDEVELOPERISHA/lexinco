<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexinco Community Feed</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #0f0f0f;
      --card: #111111;
      --border: #222222;
      --text: #e5e5e5;
      --text-muted: #888888;
      --amber: #f59e0b;
      --orange: #f97316;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 1.5rem;
    }

    .logo i {
      color: var(--amber);
      font-size: 1.8rem;
    }

    .logo span {
      background: linear-gradient(135deg, var(--amber), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 12px;
      padding: 0 16px 12px;
      overflow-x: auto;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.9rem;
      white-space: nowrap;
      background: var(--card);
      color: var(--text-muted);
      transition: all .2s;
    }

    .tab.active {
      background: var(--amber);
      color: white;
    }

    /* Feed Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin: 16px;
      padding: 20px;
      transition: all .2s;
    }

    .card:hover {
      border-color: #333;
    }

    .detail-actions {
      margin: 30px 0;
      display: flex;
      gap: 12px;
      flex-direction: column;
    }

    .detail-actions button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .consult-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .consult-btn:hover {
      background: #222;
      border-color: var(--amber);
      color: var(--amber);
    }

    @media (min-width: 480px) {
      .detail-actions {
        flex-direction: row;
      }

      .detail-actions button {
        flex: 1;
      }
    }

    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--amber), var(--orange));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
    }

    .user-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .type-badge {
      background: #ff980030;
      border: 1px solid #ff980050;
      color: var(--amber);
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .ai-summary {
      background: #3b82f620;
      border: 1px solid #3b82f630;
      color: #60a5fa;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 12px 0;
    }

    .amount {
      background: #ef444420;
      border: 1px solid #ef444440;
      color: #f87171;
      padding: 6px 12px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .evidence {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .tag {
      background: var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.75rem;
      margin-top: 8px;
    }

    .status.seeking {
      background: #3b82f610;
      color: #60a5fa;
    }

    .status.action {
      background: #10b98110;
      color: #34d399;
    }

    .status.escalate {
      background: #f59e0b10;
      color: #fbbf24;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-top: 16px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: color .2s;
    }

    .action-btn:hover {
      color: var(--amber);
    }

    .generate-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--amber), var(--orange));
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all .3s;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--amber);
    }

    .nav-item i {
      font-size: 1.4rem;
    }

    /* Floating + button */
    .fab {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--amber), var(--orange));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
      cursor: pointer;
      z-index: 99;
      transition: transform .3s;
    }

    .fab:hover {
      transform: scale(1.1);
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 95vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.4rem;
    }

    .close {
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-body {
      padding: 20px;
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .lang-btn {
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: all .2s;
    }

    .lang-btn.active {
      border-color: var(--amber);
      background: rgba(245, 158, 11, 0.1);
      color: white;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: white;
      font-size: 1rem;
      resize: none;
    }

    .char-count {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--amber), var(--orange));
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Detail screen (simple) */
    #detailScreen {
      display: none;
    }

    .back-btn {
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    /* Responsive */
    @media (min-width: 768px) {
      .container {
        max-width: 600px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="/assets/logo.png" alt="Lexinco Logo" width="120" height="auto">
      </a>
      <div id="searchContainer">
        <i class="fa-solid fa-magnifying-glass" id="searchIcon" onclick="toggleSearch()" style="cursor:pointer;"></i>
        <input type="text" id="searchInput" placeholder="Search stories..."
          style="display:none; width:0; padding:0 12px; border:none; background:var(--card); color:white; border-radius:50px; transition:all .3s;"
          oninput="performSearch()" onblur="hideSearchIfEmpty()">
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="setFilter('all')">All Issues</div>
      <div class="tab" onclick="setFilter('trending')">Trending</div>
      <div class="tab" onclick="setFilter('recent')">Recent</div>
    </div>
  </header>

  <!-- Feed -->
  <div class="container" id="feedScreen">
    <!-- Issue Cards will be injected here by JS -->
  </div>

  <!-- Detail Screen -->
  <div id="detailScreen">
    <header>
      <div class="header-inner">
        <i class="fa-solid fa-chevron-left back-btn" onclick="showFeed()"></i>
        <div>Issue Details</div>
      </div>
    </header>
    <div class="container" id="detailContent"></div>
  </div>

  <!-- Floating Action Button -->
  <div class="fab" onclick="openShareModal()">
    <i class="fa-solid fa-plus"></i>
  </div>

  <!-- Share Modal -->
  <div class="modal" id="shareModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Share Your Story</h2>
        <span class="close" onclick="closeShareModal()">&times;</span>
      </div>
      <div class="modal-body">
        <div
          style="background:#3b82f620; border:1px solid #3b82f630; padding:16px; border-radius:12px; display:flex; gap:12px;">
          <i class="fa-solid fa-sparkles" style="color:#60a5fa;"></i>
          <div style="font-size:0.9rem; color:#94bfff;">
            <strong>Write in your language.</strong> Our AI will summarize your issue clearly.
          </div>
        </div>

        <p style="margin:20px 0 8px; color:var(--text-muted); font-weight:600;">
          📝 Write your story in your own language
        </p>


        <p style="margin:20px 0 8px; color:var(--text-muted);">Describe your situation</p>
        <textarea id="postText" placeholder="Write your story freely."></textarea>
        <div class="char-count">0 characters</div>
        <div
          style="margin: 20px 0; padding: 16px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 12px; display: flex; align-items: center; gap: 12px;">
          <input type="checkbox" id="anonymousCheckbox"
            style="width:20px; height:20px; cursor:pointer; accent-color:var(--amber);">
          <label for="anonymousCheckbox" style="cursor:pointer; font-size:0.95rem; color:var(--text);">
            <strong>Post anonymously</strong><br>
            <span style="font-size:0.85rem; color:var(--text-muted);">Your name will not appear on the story</span>
          </label>
        </div>

        <button class="submit-btn">Share My Story</button>
        <p style="text-align:center; margin-top:16px; color:var(--text-muted); font-size:0.85rem;">
          Your story matters. You are not alone.
        </p>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="showFeed()">
      <i class="fa-solid fa-house"></i>
      <span>Feed</span>
    </div>
    <div class="nav-item" onclick="openShareModal()">
      <i class="fa-solid fa-plus"></i>
      <span>Share</span>
    </div>
    <div class="nav-item" onclick="showProfile()">
      <i class="fa-solid fa-user"></i>
      <span id="profileName">Profile</span>
    </div>
  </div>

  <script>
    const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000' : '';

    let USER = null;
    let USER_ID = null;
    let CURRENT_FILTER = 'all';
    let CURRENT_STORY_ID = null;
    let STORIES = [];

    function checkAuth() {
      const userData = sessionStorage.getItem('lexinco_user');
      if (userData) {
        USER = JSON.parse(userData);
        USER_ID = USER.id;

        // Update profile name
        const profileSpan = document.getElementById('profileName');
        if (profileSpan) profileSpan.textContent = USER.salutation + ' ' + USER.name.split(' ')[0];

        return true;
      }
      return false; // Guests allowed
    }

    function logout() {
      sessionStorage.removeItem('lexinco_user');
      window.location.href = 'login.html';
    }

    // === HELPERS ===
    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      const intervals = [
        { label: 'year', seconds: 31536000 },
        { label: 'month', seconds: 2592000 },
        { label: 'day', seconds: 86400 },
        { label: 'hour', seconds: 3600 },
        { label: 'minute', seconds: 60 }
      ];
      for (const i of intervals) {
        const count = Math.floor(seconds / i.seconds);
        if (count >= 1) return count === 1 ? `1 ${i.label} ago` : `${count} ${i.label}s ago`;
      }
      return 'just now';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // === RENDER FEED ===
    function renderFeed(stories) {
      STORIES = stories;
      const container = document.getElementById('feedScreen');
      if (!stories.length) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin:40px 0;">No stories yet. Be the first to share!</p>';
        return;
      }

      container.innerHTML = stories.map(s => {
        const isLiked = !!s.liked_by_user;
        const likeIcon = isLiked ? 'fa-solid fa-thumbs-up' : 'fa-regular fa-thumbs-up';
        const likeColor = isLiked ? 'var(--amber)' : 'var(--text-muted)';
        const displayName = s.user_name ? `${s.user_salutation || 'Mr.'} ${s.user_name.split(' ')[0]}` : 'Anonymous';

        return `
              <div class="card" onclick="showDetail('${s.story_id}')">
                  <div class="user-row">
                      <div class="user-info">
                          <div class="avatar"><i class="fa-solid fa-user"></i></div>
                          <div>
                              <div style="font-weight:600;">${displayName}</div>
                              <div class="user-meta"><i class="fa-solid fa-globe"></i> ${s.original_lang} • ${timeAgo(s.created_at)}</div>
                          </div>
                      </div>
                      ${s.type ? `<div class="type-badge">${s.type}</div>` : ''}
                  </div>

                  <div class="ai-summary"><i class="fa-solid fa-sparkles"></i> AI Summary</div>
                  <p style="margin:12px 0; line-height:1.6;">${escapeHtml(s.ai_summary || '')}</p>

                  <div style="display:flex; gap:16px; flex-wrap:wrap; margin:8px 0;">
                      ${s.amount ? `<div class="amount">${s.amount}</div>` : ''}
                      ${s.evidence_count ? `<div class="evidence"><i class="fa-solid fa-paperclip"></i> ${s.evidence_count} files</div>` : ''}
                  </div>

                  <div class="tags">
                      ${(s.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}
                  </div>

                  <div class="actions">
                      <div class="status ${s.status === 'ready_escalate' ? 'escalate' : s.status === 'action_plan' ? 'action' : 'seeking'}">
                          ${s.status === 'ready_escalate' ? '<i class="fa-solid fa-shield-halved"></i> Ready to Escalate' :
            s.status === 'action_plan' ? '<i class="fa-solid fa-circle-check"></i> Action Plan' :
              '<i class="fa-solid fa-circle-info"></i> Seeking Guidance'}
                      </div>
                      <div style="display:flex; gap:20px;">
                          <div class="action-btn" onclick="event.stopPropagation(); toggleLike('${s.story_id}', this)">
                              <i class="${likeIcon}" style="color:${likeColor}"></i> <span>${s.likes_count || 0}</span>
                          </div>
                          <div class="action-btn" onclick="event.stopPropagation(); showDetail('${s.story_id}')">
                              <i class="fa-solid fa-message"></i> <span>${s.comments_count || 0}</span>
                          </div>
                      </div>
                  </div>

                  <button class="generate-btn" onclick="event.stopPropagation(); window.location.href='legal-notice.html?story_id=${s.story_id}'">
                      Generate Legal Notice
                  </button>
              </div>`;
      }).join('');
    }

    async function loadFeed(filter = CURRENT_FILTER) {
      try {
        let url = filter === 'all' ? `${API}/api/stories` : `${API}/api/stories/filter?filter=${filter}`;
        if (!USER_ID) url += (url.includes('?') ? '&' : '?') + 'public=1'; // allow guest view

        const headers = USER_ID ? { 'user-id': USER_ID } : {};
        const res = await fetch(url, { headers });
        const data = await res.json();
        if (data.success) {
          const stories = data.stories || [];
          originalStories = stories;  // Save full list
          renderFeed(stories);
        }
      } catch (e) { console.error(e); }
    }

    function setFilter(filter) {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
        if (tab.textContent.includes(
          filter === 'all' ? 'All' :
            filter === 'trending' ? 'Trending' : 'Recent'
        )) {
          tab.classList.add('active');
        }
      });
      CURRENT_FILTER = filter;
      loadFeed(filter);
    }

    // === LIKE ===
    async function toggleLike(storyId, btn) {
      if (!USER_ID) return requireLogin();
      if (!USER_ID) { alert('Login required'); window.location.href = 'login.html'; return; }
      try {
        const res = await fetch(`${API}/api/story/${storyId}/like`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: USER_ID })
        });
        const json = await res.json();
        if (json.success) {
          const icon = btn.querySelector('i');
          const count = btn.querySelector('span');
          if (json.liked) {
            icon.className = 'fa-solid fa-thumbs-up';
            icon.style.color = 'var(--amber)';
            count.textContent = (parseInt(count.textContent) + 1);
          } else {
            icon.className = 'fa-regular fa-thumbs-up';
            icon.style.color = '';
            count.textContent = (parseInt(count.textContent) - 1);
          }
        }
      } catch (e) { console.error(e); }
    }

    // === COMMENTS ===
    async function loadComments(storyId) {
      const res = await fetch(`${API}/api/story/${storyId}/comments`);
      const data = await res.json();
      return data.success ? data.comments : [];
    }

    async function postComment(storyId, content, parentId = null) {
      const res = await fetch(`${API}/api/story/${storyId}/comment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID, content, parent_id: parentId })
      });
      const json = await res.json();
      return json.success ? json.comment : null;
    }

    function renderComment(c, depth = 0) {
      const indent = depth * 30;
      const displayName = c.user_name ? `${c.user_salutation || 'Mr.'} ${c.user_name.split(' ')[0]}` : 'Anonymous';
      return `
          <div style="margin-left:${indent}px; padding-left:12px; border-left:2px solid var(--border); margin-top:12px;">
              <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">
                  ${displayName} • ${timeAgo(c.created_at)}
              </div>
              <p style="margin:6px 0; font-size:0.95rem;">${escapeHtml(c.content)}</p>
              <a href="javascript:void(0)" onclick="showReplyBox('${c.comment_id}', this)" style="font-size:0.8rem; color:var(--amber);">Reply</a>
              <div id="reply-${c.comment_id}"></div>
          </div>`;
    }

    function renderComments(comments) {
      const tree = {}; const roots = [];
      comments.forEach(c => c.parent_id ? (tree[c.parent_id] || (tree[c.parent_id] = [])).push(c) : roots.push(c));
      const build = node => renderComment(node) + (tree[node.comment_id] || []).map(build).join('');
      return roots.map(build).join('');
    }

    // === SHOW DETAIL (THIS WAS MISSING!) ===
    async function showDetail(story_id) {
      CURRENT_STORY_ID = story_id;
      const story = STORIES.find(s => s.story_id === story_id);
      if (!story) return;

      const comments = await loadComments(story_id);
      const displayName = story.user_name ? `${story.user_salutation || 'Mr.'} ${story.user_name.split(' ')[0]}` : 'Anonymous';

      document.getElementById('detailContent').innerHTML = `
          <div class="card">
              <div class="user-row">
                  <div class="user-info">
                      <div class="avatar"><i class="fa-solid fa-user"></i></div>
                      <div>
                          <div style="font-weight:600;">${displayName}</div>
                          <div class="user-meta">${story.original_lang} • ${timeAgo(story.created_at)}</div>
                      </div>
                  </div>
              </div>

              <div class="ai-summary"><i class="fa-solid fa-sparkles"></i> AI Summary</div>
              <p style="margin:16px 0; line-height:1.7;">${escapeHtml(story.ai_summary)}</p>

              <p style="color:var(--text-muted); margin:20px 0 8px;">Original Story</p>
              <div style="background:var(--bg); padding:16px; border-radius:12px; white-space:pre-wrap; font-size:0.95rem;">
                  ${escapeHtml(story.original_text)}
              </div>

<div class="detail-actions">
    <button class="generate-btn" onclick="window.location.href='legal-notice.html?story_id=${story_id}'">
        <i class="fa-solid fa-file-lines"></i> Generate Legal Notice
    </button>
    <button class="consult-btn" onclick="window.location.href='consultation.html?story_id=${story_id}'">
        <i class="fa-solid fa-phone"></i> Consult Advocate
    </button>
</div>

              <div style="border-top:1px solid var(--border); padding-top:20px;">
                  <h3 style="margin-bottom:12px;">Comments (${comments.length})</h3>
                  <textarea id="commentInput" placeholder="Write a supportive comment..." style="height:90px; margin-bottom:8px;"></textarea>
                  <button class="submit-btn" style="padding:10px;" onclick="submitComment('${story_id}')">Post Comment</button>
                  <div id="commentsContainer" style="margin-top:20px;">
                      ${renderComments(comments)}
                  </div>
              </div>
          </div>`;

      document.getElementById('feedScreen').style.display = 'none';
      document.getElementById('detailScreen').style.display = 'block';
    }

    function showFeed() {
      document.getElementById('detailScreen').style.display = 'none';
      document.getElementById('feedScreen').style.display = 'block';
    }

    function showReplyBox(parentId, el) {
      if (document.getElementById(`reply-box-${parentId}`)) return;
      const box = `<div id="reply-box-${parentId}" style="margin:12px 0;">
              <textarea id="reply-input-${parentId}" placeholder="Write your reply..." style="height:70px;"></textarea>
              <div style="margin-top:8px; display:flex; gap:8px;">
                  <button class="submit-btn" style="padding:8px 16px; font-size:0.9rem;" onclick="submitReply('${parentId}')">Reply</button>
                  <button onclick="document.getElementById('reply-box-${parentId}').remove()" style="background:transparent; color:var(--text-muted); border:none;">Cancel</button>
              </div>
          </div>`;
      el.parentElement.insertAdjacentHTML('afterend', box);
    }

    async function submitComment(storyId) {
      if (!USER_ID) return requireLogin();
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content) return;
      const comment = await postComment(storyId, content);
      if (comment) { input.value = ''; showDetail(storyId); }
    }

    async function submitReply(parentId) {
      const input = document.getElementById(`reply-input-${parentId}`);
      const content = input.value.trim();
      if (!content) return;
      const comment = await postComment(CURRENT_STORY_ID, content, parentId);
      if (comment) {
        document.getElementById(`reply-box-${parentId}`).remove();
        showDetail(CURRENT_STORY_ID);
      }
    }

    // === MODAL & POST ===
    function openShareModal() {
      if (!USER_ID) return requireLogin();
      document.getElementById('shareModal').classList.add('active');
    }
    function updateBottomNav(activeItem) {
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });
      if (activeItem === 'feed') {
        document.querySelector('.bottom-nav .nav-item:nth-child(1)').classList.add('active');
      } else if (activeItem === 'profile') {
        document.querySelector('.bottom-nav .nav-item:nth-child(3)').classList.add('active');
      }
    }
    function closeShareModal() { document.getElementById('shareModal').classList.remove('active'); }

    document.querySelector('.submit-btn')?.addEventListener('click', async () => {
      if (!USER_ID) return alert('Login required');

      const text = document.getElementById('postText').value.trim();
      if (!text) return alert('Please write your story');

      const isAnonymous = document.getElementById('anonymousCheckbox').checked;

      const res = await fetch(`${API}/api/story`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: USER_ID,
          original_lang: 'english',
          original_text: text,
          is_anonymous: isAnonymous
        })
      });

      const json = await res.json();
      if (json.success) {
        closeShareModal();
        document.getElementById('postText').value = '';
        document.getElementById('anonymousCheckbox').checked = false;
        alert('Story posted successfully!');
        loadFeed();
      } else {
        alert('Failed to post story');
      }
    });

    // === PROFILE (already good) ===
    async function showProfile() {
      if (!USER_ID) {
        location.href = 'signup.html';
        return;
      }

      try {
        const res = await fetch(`${API}/api/user/${USER_ID}/stories`);
        const data = await res.json();

        document.getElementById('detailContent').innerHTML = `
      <div class="card" style="text-align:center;padding:40px;">
        <div class="avatar" style="width:90px;height:90px;font-size:2.5rem;margin:0 auto 20px;">
          <i class="fa-solid fa-user"></i>
        </div>
        <h2>${USER.salutation} ${USER.name}</h2>
        <p style="color:var(--text-muted);margin:20px 0;">${data.stories?.length || 0} stories shared</p>
        <button onclick="logout()" style="background:var(--red);color:white;padding:12px 24px;border:none;border-radius:12px;">Logout</button>

        <h3 style="margin:40px 0 16px;text-align:left;">Your Stories</h3>
        ${data.stories?.length ? data.stories.map(s => `
          <div class="card" style="margin:12px 0;padding:16px;cursor:pointer;" onclick="showDetail('${s.story_id}')">
            <p style="font-weight:600;">${escapeHtml((s.ai_summary || '').substring(0, 100))}...</p>
            <p style="font-size:0.8rem;color:var(--text-muted);">${timeAgo(s.created_at)}</p>
          </div>
        `).join('') : '<p style="color:var(--text-muted);">You haven\'t shared any story yet.</p>'}
      </div>`;

        document.getElementById('feedScreen').style.display = 'none';
        document.getElementById('detailScreen').style.display = 'block';
        updateBottomNav('profile');
      } catch (e) { console.error(e); }
    }

    // === INIT ===
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      loadFeed();

      // Make functions global so onclick works
      window.setFilter = setFilter;
      window.showFeed = showFeed;
      window.showDetail = showDetail;
      window.toggleLike = toggleLike;
      window.showReplyBox = showReplyBox;
      window.submitComment = submitComment;
      window.submitReply = submitReply;
      window.showProfile = showProfile;
    });
    function requireLogin() {
      sessionStorage.setItem('redirect_after_login', location.href);
      location.href = 'signup.html';
    }

    // Reminder after scrolling
    let scrolled = 0;
    window.addEventListener('scroll', () => {
      if (USER_ID) return;
      scrolled++;
      if (scrolled > 6 && !document.getElementById('guestHint')) {
        const hint = document.createElement('div');
        hint.id = 'guestHint';
        hint.innerHTML = `You are not alone — <a href="signup.html" style="color:var(--amber);font-weight:600;">Join community</a> to support others`;
        hint.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--amber);padding:12px 20px;border-radius:50px;z-index:100;font-size:0.9rem;';
        document.body.appendChild(hint);
        setTimeout(() => hint.remove(), 7000);
      }
    });
    let originalStories = []; // Will store all stories for filtering

    function toggleSearch() {
      const input = document.getElementById('searchInput');
      const icon = document.getElementById('searchIcon');

      if (input.style.display === 'none' || !input.style.display) {
        input.style.display = 'block';
        input.style.width = '200px';
        input.focus();
        icon.style.opacity = '0.6';
      }
    }

    function hideSearchIfEmpty() {
      const input = document.getElementById('searchInput');
      const icon = document.getElementById('searchIcon');
      setTimeout(() => {
        if (!input.value.trim()) {
          input.style.width = '0';
          input.style.padding = '0 12px';
          setTimeout(() => { input.style.display = 'none'; }, 300);
          icon.style.opacity = '1';
        }
      }, 200);
    }

    function performSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        renderFeed(originalStories);
        return;
      }

      const filtered = originalStories.filter(story => {
        const summary = (story.ai_summary || '').toLowerCase();
        const original = (story.original_text || '').toLowerCase();
        const tags = (story.tags || []).join(' ').toLowerCase();
        return summary.includes(query) || original.includes(query) || tags.includes(query);
      });

      renderFeed(filtered);
    }
  </script>
</body>

</html>
