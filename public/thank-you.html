    <style>
        :root {
            --primary-color: #1e293b;
            --secondary-color: #3b82f6;
            --accent-color: #ef4444;
            --success-color: #10b981;
            --error-color: #ef4444;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --border-radius: 16px;
            --border-radius-sm: 8px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            --gradient-secondary: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            --gradient-bg: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gradient-bg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--gray-600);
            font-size: 16px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Floating background elements */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .floating-shapes::before,
        .floating-shapes::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .floating-shapes::before {
            width: 300px;
            height: 300px;
            background: var(--gradient-primary);
            top: 10%;
            right: 10%;
            animation-delay: 0s;
        }

        .floating-shapes::after {
            width: 200px;
            height: 200px;
            background: var(--gradient-secondary);
            bottom: 20%;
            left: 15%;
            animation-delay: 10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        /* Hero Section */
        .thank-you-hero {
            width: 100%;
            padding: 60px 20px 80px;
            background: var(--gradient-primary);
            position: relative;
            overflow: hidden;
            text-align: center;
            margin-bottom: -40px;
        }

        .thank-you-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="white" stroke-width="1" opacity="0.1"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            color: var(--white);
        }

        .hero-content h1 {
            font-size: 3rem;
            font-weight: 700;
            margin: 0 0 16px 0;
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .hero-content p {
            font-size: 1.25rem;
            font-weight: 400;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Main Container */
        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* Thank You Card */
        .thank-you-card {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thank-you-card h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 16px 0;
        }

        .success-message {
            font-size: 1rem;
            color: var(--gray-500);
            padding: 16px;
            background: var(--gray-50);
            border-radius: var(--border-radius-sm);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .success-message i {
            color: var(--success-color);
            font-size: 1.2rem;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: var(--border-radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: var(--white);
            box-shadow: var(--shadow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--gray-600);
            border: 2px solid var(--gray-200);
        }

        .btn-secondary:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .update-info {
            font-size: 0.95rem;
            color: var(--gray-500);
            margin-top: 24px;
        }

        .update-info a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .update-info a:hover {
            color: var(--accent-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-container {
                padding: 0 12px;
            }

            .thank-you-hero {
                padding: 32px 12px 48px;
                margin-bottom: -24px;
            }

            .thank-you-hero h1 {
                font-size: 2rem;
            }

            .thank-you-hero p {
                font-size: 1rem;
            }

            .thank-you-card {
                padding: 24px;
            }

            .thank-you-card h2 {
                font-size: 1.5rem;
            }

            .success-message {
                font-size: 0.9rem;
                padding: 12px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .form-actions {
                flex-direction: column;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .thank-you-hero {
                padding: 24px 10px 40px;
            }

            .thank-you-hero h1 {
                font-size: 1.8rem;
            }

            .thank-you-hero p {
                font-size: 0.9rem;
            }

            .thank-you-card {
                padding: 20px;
            }

            .thank-you-card h2 {
                font-size: 1.3rem;
            }

            .success-message {
                font-size: 0.85rem;
                padding: 10px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }

            .floating-shapes::before {
                width: 150px;
                height: 150px;
            }

            .floating-shapes::after {
                width: 100px;
                height: 100px;
            }
        }

        /* Accessibility improvements */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus states for keyboard navigation */
        .btn:focus {
            outline: 2px solid var(--secondary-color);
            outline-offset: 2px;
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --gray-200: #000000;
                --gray-500: #000000;
                --secondary-color: #0000ff;
                --accent-color: #ff0000;
            }
        }
    </style>
</head>

<body>
    <div class="floating-shapes"></div>

    <section class="thank-you-hero">
        <div class="hero-content">
            <h1>Thank You!</h1>
            <p>Your consultation request has been received.</p>
        </div>
    </section>

    <div class="main-container">
        <div class="thank-you-card">
            <h2>What's Next</h2>
            <div class="success-message">
                <i class="fas fa-check-circle"></i>
                <span>We don’t keep you waiting. An advocate will review your details promptly and get in
                    touch—typically within 24 hours.</span>
            </div>
            <div class="form-actions">
                <a href="blog.html" class="btn btn-secondary">
                    <i class="fas fa-book"></i>
                    <span>Read Our Legal Guides</span>
                </a>
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i>
                    <span>Return to Home</span>
                </a>
            </div>
            <p class="update-info">
                Need to update your information?
                <a href="mailto:support@lexinco.com" aria-label="Email Lexinco support at support@lexinco.com">Email
                    support@lexinco.com</a>
            </p>
        </div>
    </div>

    <script>
        // Lazy-load hero background image
        document.addEventListener('DOMContentLoaded', () => {
            const hero = document.querySelector('.thank-you-hero');
            const img = new Image();
            img.src = '/images/hero-bg.jpg';
            img.onload = () => {
                hero.style.backgroundImage = `url('/images/hero-bg.jpg'), var(--gradient-primary)`;
            };
        });

        // Track lead conversion with safety checks
        document.addEventListener('DOMContentLoaded', () => {
            // Facebook Pixel tracking
            if (typeof fbq === 'function') {
                fbq('track', 'Lead');
            } else {
                console.warn('Facebook Pixel not loaded, skipping fbq tracking');
            }

            // Google Analytics tracking
            if (typeof gtag === 'function') {
                gtag('event', 'conversion', { 'send_to': 'G-ZEHSS991MC/lead' });
            } else {
                console.warn('Google Analytics not loaded, skipping gtag tracking');
            }
        });
    </script>
</body>
